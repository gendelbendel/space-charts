<section class="card spectrum" id="spectrum">
  <div class="card-head">
    <div>
      <h2>Spectrum</h2>
      <p class="sub">Spectral radiance, W·m⁻²·sr⁻¹·nm⁻¹<span class="long">. The rainbow band is the light you can see.</span></p>
    </div>
    <div class="seg" role="group" aria-label="Vertical scale" data-key="yscale">
      <button type="button" data-v="lin" aria-pressed="true">Linear</button>
      <button type="button" data-v="log" aria-pressed="false">Log</button>
    </div>
  </div>
  <div class="chart-box"><canvas id="chart" role="img" aria-label="Blackbody spectrum chart"></canvas><div class="tip" id="tip" hidden></div></div>
  <div class="legend" id="legend">{{legend}}</div>
</section>
