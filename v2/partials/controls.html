<div class="control-panel">
  <div class="slider-block">
    <button type="button" class="play-btn" id="play" aria-pressed="false" aria-label="Heat it up" title="Heat it up: 300 K to 40,000 K (P)"><svg viewBox="0 0 12 12" aria-hidden="true"><path class="i-play" d="M3 1v10l8-5z"/><path class="i-stop" d="M2 2h8v8H2z"/></svg></button>
    <input type="range" id="slider" min="0" max="1000" step="1" aria-label="Temperature" aria-valuetext="{{sliderValueText}}" style="--track: {{sliderTrack}};" value="{{sliderValue}}">
    <div class="ticks" id="ticks">
      <div class="tick-row classes" id="classTicks" role="group" aria-label="Spectral classes"></div>
      <div class="tick-row marks" id="markTicks"></div>
    </div>
  </div>
  <div class="controls">
    <div class="control">
      <span class="lbl" id="modelLbl">Color model</span>
      <div class="seg" role="group" aria-labelledby="modelLbl" data-key="model">
        <button type="button" data-v="simple" aria-pressed="false">Simple</button>
        <button type="button" data-v="cie" aria-pressed="true">CIE 1931</button>
        <button type="button" data-v="star" aria-pressed="false">Real stars</button>
      </div>
    </div>
    <div class="control">
      <span class="lbl" id="lightLbl">Brightness</span>
      <div class="seg" role="group" aria-labelledby="lightLbl" data-key="light">
        <button type="button" data-v="hue" aria-pressed="false">Hue only</button>
        <button type="button" data-v="eye" aria-pressed="true">Your eye</button>
        <button type="button" data-v="sun" aria-pressed="false">vs. Sun</button>
      </div>
    </div>
    <div class="control">
      <span class="lbl">Compare</span>
      <label class="check"><input type="checkbox" id="compare"> Show all three</label>
    </div>
  </div>
</div>
