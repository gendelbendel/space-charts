<div class="readout-block">
  <div class="readout">
    <label class="temp-big" id="tempBig" title="Type a temperature">
      <input class="temp-input" id="num" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" enterkeyhint="done" aria-label="Temperature in kelvin, type to change" value="{{readout}}"><span class="unit">K</span>
    </label>
  </div>
  <p class="verdict"><button type="button" class="class-chip" id="classChip" aria-expanded="false" aria-controls="classInfo">{{classChip}}</button> <span id="verdict">{{verdict}}</span></p>
  <p class="{{stageNoteClass}}" id="stageNote">{{stageNote}}</p>
</div>
<div class="class-info" id="classInfo" role="dialog" aria-label="Spectral class" hidden></div>
