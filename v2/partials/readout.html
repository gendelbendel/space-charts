  <div class="readout">
    <label class="temp-big" id="tempBig" title="Type a temperature">

    </label>
  </div>
  <p class="verdict"><button type="button" class="class-chip" id="classChip" aria-expanded="false" aria-controls="classInfo">Class G</button> <span id="verdict"></span></p>

</div>
<div class="class-info" id="classInfo" role="dialog" aria-label="Spectral class" hidden></div>
