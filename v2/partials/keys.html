<dialog class="keys" id="keys" aria-labelledby="keysTitle">
  <h2 id="keysTitle">Keyboard shortcuts</h2>
  <dl>
    <dt><kbd>←</kbd> <kbd>→</kbd></dt><dd>Previous or next class</dd>
    <dt><kbd>Shift</kbd> <kbd>←</kbd> <kbd>→</kbd></dt><dd>Fine step</dd>
    <dt><kbd>O</kbd> … <kbd>Y</kbd></dt><dd>Jump to class O, B, A, F, G, K, M, L, T or Y (B and M with <kbd>Shift</kbd>)</dd>
    <dt><kbd>S</kbd></dt><dd>The Sun</dd>
    <dt><kbd>M</kbd> <kbd>B</kbd></dt><dd>Next color model, brightness</dd>
    <dt><kbd>C</kbd></dt><dd>Compare: show all three</dd>
    <dt><kbd>P</kbd></dt><dd>Heat it up: play or stop</dd>
    <dt><kbd>?</kbd></dt><dd>This list</dd>
  </dl>
</dialog>
